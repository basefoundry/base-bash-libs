name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install validation tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash bats-core shellcheck
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install validation tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y bats shellcheck

      - name: Validate repository
        run: ./tests/validate.sh

      - name: Smoke supported runner Bash
        run: |
          bash -c '
            source "$1"
            base_std_check_bash_version
          ' bash "$PWD/lib/bash/std/lib_std.sh"

      # The exact supported lower bound runs in the compatibility job. This
      # macOS smoke exercises the known unsupported system Bash 3.2 path when
      # it is available.
      - name: Smoke unsupported macOS system Bash
        if: runner.os == 'macOS'
        run: |
          if ! /bin/bash -c '((BASH_VERSINFO[0] < 4 || (BASH_VERSINFO[0] == 4 && BASH_VERSINFO[1] < 2)))'; then
            echo "/bin/bash is supported on this runner; skipping unsupported-Bash smoke."
            exit 0
          fi

          set +e
          output="$(/bin/bash -c 'source "$1"' bash "$PWD/lib/bash/std/lib_std.sh" 2>&1)"
          status=$?
          set -e

          test "$status" -ne 0
          grep -F "requires Bash 4.2 or higher" <<<"$output"
          ! grep -F "syntax error" <<<"$output"

  bash-42-logging:
    name: Compatibility smoke (Bash 4.2.53)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Bash 4.2 compatibility smokes
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 64 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777 \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            docker.io/library/bash@sha256:0931edd3941d0603cb3d5da1cb298cf3eb6a579e09e094c3e34e2d5e9df8cddc \
            bash -c '
              set -e
              bash tests/bash-42-logging-smoke.sh 4 2 53
              bash tests/bash-42-release-smoke.sh 4 2 53
              bash tests/bash-option-contract.sh 4 2 53
              bash tests/property-contract.sh
              bash tests/artifact-contract.sh
              bash tests/benchmark-contract.sh
            '

  representative-bash:
    name: Compatibility (Bash ${{ matrix.version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 4.4.23
            image: docker.io/library/bash@sha256:43ad196f649f1a759d7d5a18c771f2d87290051b4ae053b6eadb0a8b72dbd4eb
          - version: 5.0.18
            image: docker.io/library/bash@sha256:2ec6d5dd02c732f425fe18c4bd5f02065381ec0083311dffcfb7bad62430e88f
          - version: 5.2.37
            image: docker.io/library/bash@sha256:534a5f1d11652aadaa9f08838f6637ac11a46a8b4b736a4cbf09c5945e38516f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run representative Bash contract
        env:
          BASH_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --pids-limit 128 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777 \
            --env HOME=/tmp \
            --env TMPDIR=/tmp \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            "$BASH_IMAGE" \
            bash -c '
              set -e
              bash tests/bash-option-contract.sh
              bash tests/property-contract.sh
              bash tests/artifact-contract.sh
              bash tests/benchmark-contract.sh
              bash tests/concurrency-contract.sh
            '

  release-gates:
    name: Release gates (matrix and provenance)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install validation tools
        run: sudo apt-get install -y bats shellcheck

      - name: Run networkless platform matrix
        run: ./tests/compatibility-matrix.sh --container alpine

      - name: Verify deterministic release invariants
        run: ./tests/release-invariants.sh
